plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.9'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'org.team293'
version = file('version.txt').text.trim()

application {
    mainClass = 'Main'
    applicationName = 'team-293-time'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

javafx {
    version = '21.0.9'
    modules = [
        'javafx.controls',
        'javafx.media',
        'javafx.swing'
    ]
}

dependencies {
    implementation 'com.google.api-client:google-api-client:2.9.2'
    implementation 'com.google.oauth-client:google-oauth-client-java6:1.39.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'
    implementation 'com.google.http-client:google-http-client-gson:2.2.0'
    implementation 'com.google.apis:google-api-services-sheets:v4-rev20261109-2.9.2'
    implementation 'org.json:json:20250517'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Credentials are supplied at runtime, never packaged into a distribution.
processResources {
    exclude 'credentials/**'
    from('license.txt') { into 'META-INF' }
}

// Package only the runnable JAR, not the build directory or local runtime files.
def macInput = layout.buildDirectory.dir('macos/input')
def macImage = layout.buildDirectory.dir('macos/image')
def macInstaller = layout.buildDirectory.dir('macos/installer')
def macAppName = 'Team 293 Time'
def jpackage = new File(System.getProperty('java.home'), 'bin/jpackage').absolutePath

tasks.register('prepareMacInput', Sync) {
    dependsOn shadowJar
    from(tasks.named('shadowJar').flatMap { it.archiveFile })
    into macInput
}

tasks.register('macAppImage', Exec) {
    description = 'Build an unsigned macOS application with its own Java runtime.'
    group = 'distribution'
    dependsOn prepareMacInput
    inputs.dir(macInput)
    inputs.property('appVersion', project.version.toString())
    inputs.property('javaRuntime', System.getProperty('java.runtime.version'))
    outputs.dir(macImage)
    doFirst {
        if (!System.getProperty('os.name').startsWith('Mac')) {
            throw new GradleException('macAppImage must be built on macOS.')
        }
        delete(macImage)
        commandLine jpackage,
                '--type', 'app-image',
                '--name', macAppName,
                '--app-version', project.version.toString(),
                '--vendor', 'FRC Team 293',
                '--input', macInput.get().asFile.absolutePath,
                '--main-jar', tasks.shadowJar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--dest', macImage.get().asFile.absolutePath,
                '--mac-package-identifier', 'org.team293.time',
                '--add-modules', 'java.se,jdk.crypto.ec,jdk.unsupported,jdk.localedata',
                '--java-options', '-Dfile.encoding=UTF-8'
    }
}

tasks.register('macDmg', Exec) {
    description = 'Create an unsigned DMG from the macOS application image.'
    group = 'distribution'
    dependsOn macAppImage
    inputs.dir(macImage)
    outputs.file(macInstaller.map { it.file("${macAppName}-${project.version}.dmg") })
    doFirst {
        delete(macInstaller)
        commandLine jpackage,
                '--type', 'dmg',
                '--name', macAppName,
                '--app-version', project.version.toString(),
                '--app-image', macImage.get().file("${macAppName}.app").asFile.absolutePath,
                '--dest', macInstaller.get().asFile.absolutePath
    }
}

test {
    useJUnitPlatform { excludeTags 'ui' }
}

tasks.register('uiTest', Test) {
    description = 'Exercise native JavaFX controls and capture desktop kiosk views.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ui' }
    systemProperty 'spike.review.dir', layout.buildDirectory.dir('review').get().asFile.absolutePath
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.24.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target '*.gradle'
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '*.md', '.gitignore', 'src/**/*.css'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
